<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер Финансов | UZS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">

  <!-- Шапка сайта -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">💰 Трекер Финансов (UZS)</h1>
      
      <!-- Блок авторизации -->
      <div>
        <button id="login-github-btn" onclick="signInWithGitHub()" class="flex items-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white text-sm sm:text-base font-medium py-2 px-3 sm:px-4 rounded-lg shadow transition duration-150">
          <span class="text-base sm:text-lg">🐙</span>
          <span>Войти через GitHub</span>
        </button>

        <div id="user-info" class="hidden flex items-center space-x-3">
          <span id="user-email" class="text-xs sm:text-sm font-medium"></span>
          <button onclick="signOut()" class="bg-red-600 hover:bg-red-700 text-white text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg shadow transition">
            Выйти
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Главный контент -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 text-center">
      <h2 class="text-xl font-semibold mb-2">Добро пожаловать в Трекер Финансов</h2>
      <p class="text-slate-600">Авторизуйтесь через GitHub, чтобы синхронизировать свои доходы и расходы в узбекских сумах (UZS).</p>
    </div>
  </main>

  <!-- Скрипт подключения Supabase -->
  <script>
    const SUPABASE_URL = 'https://urcwcerrsdtpcwpyslum.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4masZ39ZhuQetKQPQH39oQ_OONVwoTe';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Функция входа через GitHub
    async function signInWithGitHub() {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) {
        console.error('Ошибка входа:', error.message);
        alert('Не удалось войти: ' + error.message);
      }
    }

    // Функция выхода
    async function signOut() {
      const { error } = await supabase.auth.signOut();
      if (error) console.error('Ошибка выхода:', error.message);
      else location.reload();
    }

    // Проверка текущей сессии пользователя
    async function checkUser() {
      const { data: { session } } = await supabase.auth.getSession();
      
      const loginBtn = document.getElementById('login-github-btn');
      const userInfo = document.getElementById('user-info');
      const userEmail = document.getElementById('user-email');

      if (session && session.user) {
        loginBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userEmail.textContent = session.user.email || session.user.user_metadata.full_name || 'Пользователь';
      } else {
        loginBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
      }
    }

    // Отслеживание изменений состояния авторизации
    supabase.auth.onAuthStateChange((event, session) => {
      checkUser();
    });

    // Инициализация при загрузке страницы
    checkUser();
  </script>
</body>
</html>
