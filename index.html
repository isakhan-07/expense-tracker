<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinUzbekistan | Трекер Финансов</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0f172a] min-h-screen text-slate-100 antialiased flex flex-col justify-between font-sans">

  <!-- Шапка -->
  <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800 bg-[#1e293b]/80 backdrop-blur-md sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2 rounded-xl shadow-lg">
        <svg class="w-6 h-6 text-slate-950" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
      </div>
      <span class="text-xl font-bold tracking-wide text-white">FinUzbekistan</span>
    </div>
    <div class="flex items-center space-x-3">
      <div class="bg-slate-800 text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-slate-700 font-medium hidden sm:block">
        UZS (сум)
      </div>
      <button id="logout-btn" onclick="signOut()" class="hidden bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs sm:text-sm font-medium py-1.5 px-3 rounded-xl transition">
        Выйти
      </button>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="flex-grow flex items-center justify-center px-4 py-8">
    
    <!-- ФОРМА ВХОДА / РЕГИСТРАЦИИ -->
    <div id="auth-container" class="w-full max-w-md bg-[#1e293b] border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl">
      <div class="text-center mb-6">
        <h1 id="auth-title" class="text-2xl font-bold text-white mb-1">С возвращением!</h1>
        <p id="auth-subtitle" class="text-xs sm:text-sm text-slate-400">Войдите в свой аккаунт для доступа к финансам</p>
      </div>

      <!-- Сообщение об ошибке или успехе -->
      <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border text-center"></div>

      <!-- Быстрый вход (OAuth) -->
      <div class="space-y-2.5">
        <button onclick="signInWithProvider('google')" class="w-full flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm">
          <span class="text-red-400 font-bold">G</span>
          <span>Продолжить через Google</span>
        </button>

        <button onclick="signInWithProvider('github')" class="w-full flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span>Продолжить через GitHub</span>
        </button>
      </div>

      <div class="flex items-center my-5">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="px-3 text-[11px] tracking-wider text-slate-500 uppercase font-semibold">или по почте</span>
        <div class="flex-grow border-t border-slate-800"></div>
      </div>

      <!-- Поля логина/пароля -->
      <form onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Email</label>
          <input type="email" id="email" required placeholder="user@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Пароль (мин. 6 символов)</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition text-sm">
        </div>
        
        <button type="submit" id="auth-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition text-sm shadow-lg shadow-emerald-500/10">
          Войти в аккаунт
        </button>
      </form>

      <div class="text-center mt-5 pt-4 border-t border-slate-800">
        <button type="button" onclick="toggleAuthMode()" id="toggle-btn" class="text-xs text-emerald-400 hover:underline font-medium">
          Нет аккаунта? Зарегистрироваться
        </button>
      </div>
    </div>

    <!-- ТРЕКЕР ФИНАНСОВ (Показывается после входа) -->
    <div id="app-container" class="hidden w-full max-w-4xl bg-[#1e293b] border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-800">
        <div>
          <h2 class="text-xl font-bold text-white">Панель управления</h2>
          <p class="text-xs text-slate-400 mt-0.5">Пользователь: <span id="user-display" class="text-emerald-400 font-semibold"></span></p>
        </div>
        <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700">
          <span class="text-[10px] uppercase text-slate-400 block font-semibold">Общий Баланс</span>
          <span id="total-balance" class="text-lg font-bold text-emerald-400">0 сум</span>
        </div>
      </div>

      <!-- Форма и история -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Форма добавления -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
          <h3 class="text-xs font-semibold text-white mb-3 uppercase tracking-wider">Новая операция</h3>
          <form onsubmit="addTransaction(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">Тип</label>
              <select id="tx-type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs">
                <option value="income">Доход (+)</option>
                <option value="expense">Расход (-)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">Описание</label>
              <input type="text" id="tx-desc" required placeholder="Зарплата, Еда..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs placeholder-slate-600">
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">Сумма (UZS)</label>
              <input type="number" id="tx-amount" required min="1" placeholder="100000" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs placeholder-slate-600">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-3 rounded-lg transition text-xs shadow">
              Добавить
            </button>
          </form>
        </div>

        <!-- Список -->
        <div class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
          <div>
            <h3 class="text-xs font-semibold text-white mb-3 uppercase tracking-wider">История транзакций</h3>
            <div id="transactions-list" class="space-y-2 max-h-52 overflow-y-auto pr-1 text-xs"></div>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-3 mt-3 border-t border-slate-800 text-[11px]">
            <div class="bg-slate-800/60 p-2.5 rounded-lg">
              <span class="text-slate-400 block">Доходы:</span>
              <span id="total-income" class="text-emerald-400 font-bold">0 сум</span>
            </div>
            <div class="bg-slate-800/60 p-2.5 rounded-lg">
              <span class="text-slate-400 block">Расходы:</span>
              <span id="total-expense" class="text-rose-400 font-bold">0 сум</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://urcwcerrsdtpcwpyslum.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4masZ39ZhuQetKQPQH39oQ_OONVwoTe';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isRegisterMode = false;
    let transactions = JSON.parse(localStorage.getItem('fin_txs') || '[]');

    function showAlert(text, isError = true) {
      const alert = document.getElementById('auth-alert');
      alert.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
      if (isError) {
        alert.classList.add('bg-red-500/10', 'text-red-400', 'border-red-500/20');
      } else {
        alert.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
      }
      alert.textContent = text;
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').textContent = isRegisterMode ? 'Регистрация' : 'С возвращением!';
      document.getElementById('auth-subtitle').textContent = isRegisterMode ? 'Создайте аккаунт для учета доходов' : 'Войдите в свой аккаунт';
      document.getElementById('auth-btn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти в аккаунт';
      document.getElementById('toggle-btn').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
      document.getElementById('auth-alert').classList.add('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('auth-btn');

      btn.disabled = true;
      btn.textContent = 'Обработка...';

      if (isRegisterMode) {
        // Попытка регистрации
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          showAlert(error.message);
        } else if (data.user && data.session) {
          // Если автоподтверждение включено в Supabase
          showAlert('Регистрация успешна! Входим...', false);
          checkUser();
        } else {
          // Если требуется вход после регистрации, пробуем сразу войти
          const loginRes = await supabase.auth.signInWithPassword({ email, password });
          if (loginRes.error) {
            showAlert('Аккаунт создан! Пожалуйста, войдите с введенным паролем.', false);
            toggleAuthMode();
          } else {
            checkUser();
          }
        }
      } else {
        // Вход
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          showAlert('Неверный email или пароль (' + error.message + ')');
        } else {
          checkUser();
        }
      }

      btn.disabled = false;
      btn.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти в аккаунт';
    }

    async function signInWithProvider(provider) {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: provider,
        options: { redirectTo: window.location.origin }
      });
      if (error) showAlert(error.message);
    }

    async function signOut() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function checkUser() {
      const { data: { session } } = await supabase.auth.getSession();
      const authContainer = document.getElementById('auth-container');
      const appContainer = document.getElementById('app-container');
      const logoutBtn = document.getElementById('logout-btn');

      if (session && session.user) {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        document.getElementById('user-display').textContent = session.user.email;
        renderTransactions();
      } else {
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
        logoutBtn.classList.add('hidden');
      }
    }

    function addTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const desc = document.getElementById('tx-desc').value;
      const amount = Number(document.getElementById('tx-amount').value);

      transactions.unshift({ id: Date.now(), type, desc, amount });
      localStorage.setItem('fin_txs', JSON.stringify(transactions));

      document.getElementById('tx-desc').value = '';
      document.getElementById('tx-amount').value = '';
      renderTransactions();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('fin_txs', JSON.stringify(transactions));
      renderTransactions();
    }

    function renderTransactions() {
      const list = document.getElementById('transactions-list');
      const balanceEl = document.getElementById('total-balance');
      const incomeEl = document.getElementById('total-income');
      const expenseEl = document.getElementById('total-expense');

      if (transactions.length === 0) {
        list.innerHTML = '<p class="text-slate-500 text-center py-4">Нет транзакций</p>';
        balanceEl.textContent = '0 сум';
        incomeEl.textContent = '0 сум';
        expenseEl.textContent = '0 сум';
        return;
      }

      let income = 0, expense = 0;
      list.innerHTML = '';

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;

        const item = document.createElement('div');
        item.className = 'flex justify-between items-center bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700/50';
        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-1.5 h-1.5 rounded-full ${t.type === 'income' ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
            <span class="text-white font-medium">${t.desc}</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'} font-bold">
              ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()} сум
            </span>
            <button onclick="deleteTransaction(${t.id})" class="text-slate-500 hover:text-red-400 ml-1">✕</button>
          </div>
        `;
        list.appendChild(item);
      });

      balanceEl.textContent = (income - expense).toLocaleString() + ' сум';
      incomeEl.textContent = income.toLocaleString() + ' сум';
      expenseEl.textContent = expense.toLocaleString() + ' сум';
    }

    supabase.auth.onAuthStateChange(() => { checkUser(); });
    checkUser();
  </script>
</body>
</html>
