<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinUzbekistan | UZS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0f172a] min-h-screen text-slate-100 antialiased flex flex-col justify-between">

  <!-- Шапка -->
  <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2 rounded-xl shadow-lg">
        <svg class="w-6 h-6 text-slate-950" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
      </div>
      <span class="text-xl font-bold tracking-wide text-white">FinUzbekistan</span>
    </div>
    <div class="bg-slate-800 text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-slate-700 font-medium">
      UZS (сум)
    </div>
  </header>

  <!-- Основной контейнер авторизации -->
  <main class="flex-grow flex items-center justify-center px-4 py-8">
    <div id="auth-container" class="w-full max-w-md bg-[#1e293b] border border-slate-800 p-8 rounded-2xl shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">С возвращением!</h1>
        <p class="text-sm text-slate-400">Войдите в свой аккаунт для доступа к финансам</p>
      </div>

      <!-- Кнопки OAuth -->
      <div class="space-y-3">
        <button onclick="signInWithProvider('google')" class="w-full flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-sm">
          <span class="text-red-400 font-bold text-lg">G</span>
          <span>Продолжить через Google</span>
        </button>

        <button onclick="signInWithProvider('github')" class="w-full flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-sm">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span>Продолжить через GitHub</span>
        </button>

        <button onclick="signInWithProvider('azure')" class="w-full flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-sm">
          <div class="grid grid-cols-2 gap-0.5 w-4 h-4">
            <span class="bg-red-500"></span><span class="bg-green-500"></span>
            <span class="bg-blue-500"></span><span class="bg-yellow-500"></span>
          </div>
          <span>Продолжить через Microsoft</span>
        </button>
      </div>

      <!-- Разделитель -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="px-4 text-xs tracking-wider text-slate-500 uppercase font-semibold">или по электронной почте</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <!-- Форма Email / Пароль -->
      <form onsubmit="handleEmailLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Email</label>
          <input type="email" id="email" required placeholder="user@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Пароль</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/10">
          Войти в аккаунт
        </button>
      </form>
    </div>

    <!-- Контейнер после входа (скрыт по умолчанию) -->
    <div id="app-container" class="hidden w-full max-w-4xl bg-[#1e293b] border border-slate-800 p-8 rounded-2xl shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-white">Добро пожаловать, <span id="user-display" class="text-emerald-400"></span>!</h2>
        <button onclick="signOut()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium py-2 px-4 rounded-xl transition">
          Выйти
        </button>
      </div>
      <p class="text-slate-400">Здесь будет ваш трекер доходов и расходов в UZS.</p>
    </div>
  </main>

  <!-- Скрипт логики Supabase -->
  <script>
    const SUPABASE_URL = 'https://urcwcerrsdtpcwpyslum.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4masZ39ZhuQetKQPQH39oQ_OONVwoTe';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function signInWithProvider(provider) {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: provider,
        options: { redirectTo: window.location.origin }
      });
      if (error) alert('Ошибка входа: ' + error.message);
    }

    async function handleEmailLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        checkUser();
      }
    }

    async function signOut() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function checkUser() {
      const { data: { session } } = await supabase.auth.getSession();
      const authContainer = document.getElementById('auth-container');
      const appContainer = document.getElementById('app-container');
      const userDisplay = document.getElementById('user-display');

      if (session && session.user) {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        userDisplay.textContent = session.user.email;
      } else {
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
    }

    supabase.auth.onAuthStateChange(() => { checkUser(); });
    checkUser();
  </script>
</body>
</html>
