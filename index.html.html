<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер Финансов | UZS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">

  <!-- Шапка сайта -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight">💰 Трекер Финансов (UZS)</h1>
      
      <!-- Блок авторизации -->
      <div id="auth-section" class="flex items-center space-x-3">
        <button id="login-github-btn" onclick="signInWithGitHub()" class="flex items-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-4 rounded-lg shadow transition duration-150">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>Войти через GitHub</span>
        </button>

        <div id="user-info" class="hidden flex items-center space-x-3">
          <span id="user-email" class="text-sm font-medium"></span>
          <button onclick="signOut()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-1.5 px-3 rounded-lg shadow transition">
            Выйти
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Главный контент -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 text-center">
      <h2 class="text-xl font-semibold mb-2">Добро пожаловать в Трекер Финансов</h2>
      <p class="text-slate-600">Авторизуйтесь через GitHub, чтобы синхронизировать свои доходы и расходы в узбекских сумах (UZS).</p>
    </div>
  </main>

  <!-- Скрипт подключения Supabase -->
  <script>
    const SUPABASE_URL = 'https://urcwcerrsdtpcwpyslum.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4masZ39ZhuQetKQPQH39oQ_OONVwoTe';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Функция входа через GitHub
    async function signInWithGitHub() {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) {
        console.error('Ошибка входа:', error.message);
        alert('Не удалось войти: ' + error.message);
      }
    }

    // Функция выхода
    async function signOut() {
      const { error } = await supabase.auth.signOut();
      if (error) console.error('Ошибка выхода:', error.message);
      else location.reload();
    }

    // Проверка текущей сессии пользователя
    async function checkUser() {
      const { data: { session } } = await supabase.auth.getSession();
      
      const loginBtn = document.getElementById('login-github-btn');
      const userInfo = document.getElementById('user-info');
      const userEmail = document.getElementById('user-email');

      if (session && session.user) {
        loginBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userEmail.textContent = session.user.email || session.user.user_metadata.full_name || 'Пользователь';
      } else {
        loginBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
      }
    }

    // Отслеживание изменений состояния авторизации
    supabase.auth.onAuthStateChange((event, session) => {
      checkUser();
    });

    // Инициализация при загрузке страницы
    checkUser();
  </script>
</body>
</html>
